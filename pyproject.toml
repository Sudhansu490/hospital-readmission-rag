[project]
name = "hospital-readmission-rag"
version = "0.1.0"
description = "30-day hospital readmission prediction with RAG-style retrieval feature (LogReg / RF / fine-tuned Transformer ±RAG)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.4.6",
  "pandas>=2.0",
  "scikit-learn>=1.9.0",
  "scipy>=1.18.0",
  "torch>=2.0",
  "transformers>=4.40",
  "datasets>=3.0",
  "sentence-transformers>=3.0",
  "accelerate>=0.30",
  "pyarrow>=15.0",
  "joblib>=1.5.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
